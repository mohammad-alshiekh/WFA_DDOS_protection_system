global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'waf'
    static_configs:
      - targets: ['waf:3000']
    metrics_path: '/metrics'

  - job_name: 'target'
    static_configs:
      - targets: ['target:3001']
    metrics_path: '/metrics'

  - job_name: 'dashboard'
    static_configs:
      - targets: ['dashboard:3002']
